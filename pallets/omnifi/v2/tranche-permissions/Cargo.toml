[package]
name = "pallet-tranche-permissions-v2"
version = "1.0.0"
description = "v2 (see docs/tranche-tx-registry/settlement-leg-chunking-design.md && sibling pallet-tranche-permissions v1) - accurately weight-benchmarked fork of pallet-tranche-permissions, new products only"
authors = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# General
log = { workspace = true }
serde = { workspace = true, optional = true }

# Substrate
scale-info = { workspace = true }
parity-scale-codec = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-runtime = { workspace = true }
sp-core = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }

# OmniFi tranche-system
pallet-tranche-system = { workspace = true }

[features]
default = ["std"]
std = [
	"serde",
	"scale-info/std",
	"parity-scale-codec/std",
	"frame-support/std",
	"frame-benchmarking?/std",
	"frame-system/std",
	"sp-runtime/std",
	"sp-std/std",
	"sp-core/std",
	"sp-io/std",
	"pallet-tranche-system/std",
]
try-runtime = ["frame-support/try-runtime"]
runtime-benchmarks = [
	"frame-benchmarking",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"pallet-tranche-system/runtime-benchmarks",
]
