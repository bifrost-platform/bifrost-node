[package]
name = "pallet-tranche-tx-registry-v3"
version = "1.0.0"
description = "v3 — A template-driven, append-only registry of off-chain tx evidence for the OmniFi tranche-system (requests, settlements, whitelists, receives and any product-specific flow), attested by the single trusted recorder. Step topology lives in versioned on-chain templates, not pallet code; progress/completion is derived by counting. Supersedes pallet-tranche-custom-flows for new products (see docs/tranche-tx-registry-v3/design.md)."
authors = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# General
log = { workspace = true }
serde = { workspace = true, optional = true }

# Substrate
scale-info = { workspace = true }
parity-scale-codec = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-runtime = { workspace = true }
sp-core = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }

# OmniFi tranche-system
bp-tranche = { workspace = true }

[features]
default = ["std"]
std = [
	"serde",
	"scale-info/std",
	"parity-scale-codec/std",
	"frame-support/std",
	"frame-benchmarking?/std",
	"frame-system/std",
	"sp-runtime/std",
	"sp-std/std",
	"sp-core/std",
	"sp-io/std",
	"bp-tranche/std",
]
try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime", "sp-runtime/try-runtime"]
runtime-benchmarks = [
	"frame-benchmarking",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
