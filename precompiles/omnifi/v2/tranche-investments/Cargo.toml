[package]
name = "precompile-tranche-investments-v2"
version = "1.0.0"
description = "v2 (see docs/tranche-tx-registry/settlement-leg-chunking-design.md && sibling precompile-tranche-investments v1) - accurately weight-benchmarked fork, new products only"
authors = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# OmniFi tranche-system
pallet-tranche-system = { workspace = true }
pallet-tranche-investments-v2 = { workspace = true }
precompile-utils = { workspace = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

# Frontier / EVM
fp-evm = { workspace = true }
pallet-evm = { workspace = true, features = ["forbid-evm-reentrancy"] }

[features]
default = ["std"]
std = [
	"fp-evm/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-tranche-system/std",
	"pallet-tranche-investments-v2/std",
	"pallet-evm/std",
	"precompile-utils/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-std/std",
]
